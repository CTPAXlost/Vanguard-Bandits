name: Release Windows Remaster

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.6.3"
      GODOT_STATUS: "stable"
      GODOT_CACHE_DIR: "${{ github.workspace }}/.cache/godot"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install --upgrade Pillow

      - name: Run importer tests
        run: python -m unittest discover -s tools/tests -v


      - name: Cache Godot editor and export templates
        uses: actions/cache@v4
        with:
          path: .cache/godot
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}

      - name: Download Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GODOT_CACHE_DIR"
          GODOT_ZIP="$GODOT_CACHE_DIR/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATES_TPZ="$GODOT_CACHE_DIR/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          GODOT_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"

          download_with_resume() {
            local url="$1"
            local output="$2"
            local label="$3"
            if [ -s "$output" ]; then
              echo "$label already exists in cache: $output"
              return 0
            fi
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Downloading $label (attempt $attempt/8)..."
              if curl --http1.1 --fail --location                 --retry 4 --retry-delay 4 --retry-all-errors                 --connect-timeout 30 --speed-time 90 --speed-limit 1024                 --continue-at - --output "$output" "$url"; then
                return 0
              fi
              sleep $((attempt * 5))
            done
            return 1
          }

          download_with_resume "$GODOT_URL" "$GODOT_ZIP" "Godot editor"
          download_with_resume "$TEMPLATES_URL" "$TEMPLATES_TPZ" "Godot export templates"

          rm -rf godot templates-unpacked
          mkdir -p godot templates-unpacked
          unzip -q -t "$GODOT_ZIP"
          unzip -q "$GODOT_ZIP" -d godot
          chmod +x "godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          unzip -q -t "$TEMPLATES_TPZ"
          unzip -q "$TEMPLATES_TPZ" -d templates-unpacked
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          rm -rf "$TEMPLATE_DIR"
          mkdir -p "$TEMPLATE_DIR"
          cp -R templates-unpacked/templates/. "$TEMPLATE_DIR/"
          test -f "$TEMPLATE_DIR/windows_release_x86_64.exe"

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --path project --import --quit-after 300

      - name: Runtime parse test for battle script chain
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project --script res://scripts/script_chain_smoke.gd 2>&1 | tee script-chain-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|SCRIPT_CHAIN_SMOKE_FAILED" script-chain-smoke.log; then
            echo "Battle script chain failed to compile." >&2
            exit 1
          fi
          grep -q "SCRIPT_CHAIN_SMOKE_OK layers=6" script-chain-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for battle scene
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/BattlePrototype.tscn --quit-after 8 2>&1 | tee battle-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|BATTLE_READY_FAILED" battle-smoke.log; then
            echo "Battle scene smoke test found a runtime/script error." >&2
            exit 1
          fi
          grep -q "BATTLE_READY_OK mission=1" battle-smoke.log
          exit "$STATUS"

      - name: Runtime startup test for missions 1 through 6
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/BattleStartupSmoke.tscn --quit-after 4200 2>&1 | tee battle-startup-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|BATTLE_STARTUP_SMOKE_FAILED|BATTLE_READY_FAILED" battle-startup-smoke.log; then
            echo "Mission startup smoke test found an error." >&2
            exit 1
          fi
          for mission in 1 2 3 4 5 6; do
            grep -q "BATTLE_STARTUP_MISSION_${mission}_OK" battle-startup-smoke.log
          done
          grep -q "BATTLE_STARTUP_SMOKE_OK" battle-startup-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for mouse movement input
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/MovementInputSmoke.tscn --quit-after 1800 2>&1 | tee movement-input-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|MOVEMENT_INPUT_SMOKE_FAILED|BATTLE_READY_FAILED" movement-input-smoke.log; then
            echo "Mouse movement input smoke test found an error." >&2
            exit 1
          fi
          grep -q "MOVEMENT_INPUT_SMOKE_OK" movement-input-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for mission 3 branch scene
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/Mission3Smoke.tscn --quit-after 3000 2>&1 | tee mission3-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|MISSION3_MOVEMENT_SMOKE_FAILED" mission3-smoke.log; then
            echo "Mission 3 smoke test found a runtime/script error." >&2
            exit 1
          fi
          grep -q "MISSION3_MOVEMENT_UNLOCK_OK" mission3-smoke.log
          grep -q "MISSION3_BRANCH_3A_MOVEMENT_OK" mission3-smoke.log
          grep -q "MISSION3_BRANCH_3B_MOVEMENT_OK" mission3-smoke.log
          grep -q "MISSION3_SMOKE_OK" mission3-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for castle rescue mission
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/Mission4Smoke.tscn --quit-after 300 2>&1 | tee mission4-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function" mission4-smoke.log; then
            echo "Castle rescue mission smoke test found a runtime/script error." >&2
            exit 1
          fi
          exit "$STATUS"


      - name: Runtime smoke test for castle defense mission
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/Mission5Smoke.tscn --quit-after 1200 2>&1 | tee mission5-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|MISSION5_SMOKE_FAILED" mission5-smoke.log; then
            echo "Castle defense mission smoke test found a runtime/script error." >&2
            exit 1
          fi
          grep -q "MISSION5_DEFENSE_SMOKE_OK" mission5-smoke.log
          grep -q "MISSION5_NEUTRAL_GROUP_SMOKE_OK" mission5-smoke.log
          grep -q "MISSION5_NEUTRAL_POSITION_SMOKE_OK" mission5-smoke.log
          grep -q "MISSION5_GATE_SMOKE_OK" mission5-smoke.log
          grep -q "MISSION5_ZAKOV_TRIGGER_SMOKE_OK" mission5-smoke.log
          grep -q "MISSION5_ZAKOV_WAVE_SMOKE_OK" mission5-smoke.log
          grep -q "SHARKING_ARMOR_SMOKE_OK" mission5-smoke.log
          grep -q "NORMALIZED_ATAC_SCALE_SMOKE_OK" mission5-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for war of two kingdoms
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/Mission6Smoke.tscn --quit-after 2400 2>&1 | tee mission6-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|MISSION6_SMOKE_FAILED|BATTLE_READY_FAILED" mission6-smoke.log; then
            echo "Mission 6 smoke test found a runtime/script error." >&2
            exit 1
          fi
          grep -q "MISSION6_SOUTH_BRANCH_OK" mission6-smoke.log
          grep -q "MISSION6_NORTH_BRANCH_OK" mission6-smoke.log
          grep -q "MISSION6_SMOKE_OK" mission6-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for skeletal tactical ATAC models
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/VisibilitySmoke.tscn --quit-after 900 2>&1 | tee visibility-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|TACTICAL_VISIBILITY_.*FAILED" visibility-smoke.log; then
            echo "Skeletal tactical ATAC smoke test found an error." >&2
            exit 1
          fi
          grep -q "SKELETAL_ATAC_SMOKE_OK" visibility-smoke.log
          grep -q "ORIGINAL_SKIN_RIG_SMOKE_OK" visibility-smoke.log
          grep -q "BASIC_ATTACK_ANIMATION_SMOKE_OK" visibility-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for defeated ATAC cleanup
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/DeathCleanupSmoke.tscn --quit-after 900 2>&1 | tee death-cleanup-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|DEATH_CLEANUP_SMOKE_FAILED" death-cleanup-smoke.log; then
            echo "Defeated ATAC cleanup smoke test found an error." >&2
            exit 1
          fi
          grep -q "DEATH_CLEANUP_SMOKE_OK" death-cleanup-smoke.log
          exit "$STATUS"

      - name: Runtime smoke test for common team shop
        shell: bash
        run: |
          set -euo pipefail
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          set +e
          "$GODOT" --headless --path project res://scenes/Shop.tscn --quit-after 5 2>&1 | tee shop-smoke.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Invalid access|Cannot get node|Nonexistent function|SHOP_CATALOG_FAILED" shop-smoke.log; then
            echo "Common team shop smoke test found a runtime/script error." >&2
            exit 1
          fi
          grep -q "SHOP_CATALOG_OK items=12" shop-smoke.log
          exit "$STATUS"

      - name: Export Windows build with real models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          GODOT="godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          "$GODOT" --headless --path project --export-release "Windows Desktop (Local Imported)" "../build/windows/Vanguard Bandits Remaster.exe"
          cp README.md build/windows/README.txt
          test -s "build/windows/Vanguard Bandits Remaster.exe"
          cd build
          zip -r "Vanguard-Bandits-Remaster-${GITHUB_REF_NAME}-Windows-x64.zip" windows

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Vanguard-Bandits-Remaster-${{ github.ref_name }}-Windows-x64.zip
          generate_release_notes: true
