name: Godot 4.6.3 CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.3"
  GODOT_RELEASE: "4.6.3-stable"
  GODOT_BINARY: "Godot_v4.6.3-stable_linux.x86_64"
  GODOT_CACHE_DIR: "${{ github.workspace }}/.ci-cache/godot/4.6.3"
  TEMPLATE_DIR: "${{ github.workspace }}/.ci-cache/export_templates/4.6.3.stable"

jobs:
  validate-runtime:
    name: Validate and runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Godot editor cache
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/godot/4.6.3
          key: ${{ runner.os }}-godot-editor-4.6.3-v2

      - name: Install Godot 4.6.3 when cache is empty
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_CACHE_DIR"
          archive="$RUNNER_TEMP/godot-4.6.3.zip"
          urls=(
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
            "https://downloads.godotengine.org/?flavor=stable&platform=linux.64&slug=linux.x86_64.zip&version=${GODOT_VERSION}"
          )
          downloaded=false
          for url in "${urls[@]}"; do
            echo "Downloading Godot editor from: $url"
            if curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
              --connect-timeout 30 --max-time 720 -C - "$url" -o "$archive"; then
              downloaded=true
              break
            fi
            rm -f "$archive"
          done
          test "$downloaded" = true
          unzip -q "$archive" -d "$GODOT_CACHE_DIR"
          chmod +x "$GODOT_CACHE_DIR/$GODOT_BINARY"
          "$GODOT_CACHE_DIR/$GODOT_BINARY" --version

      - name: Save Godot editor cache
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/godot/4.6.3
          key: ${{ runner.os }}-godot-editor-4.6.3-v2

      - name: Set Godot path
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GODOT_CACHE_DIR/$GODOT_BINARY"
          echo "GODOT=$GODOT_CACHE_DIR/$GODOT_BINARY" >> "$GITHUB_ENV"

      - name: Python validation
        run: python3 tools/validate_project.py

      - name: Restore Godot import cache
        id: import-cache
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: ${{ runner.os }}-vbr-import-4.6.3-${{ hashFiles('project.godot', 'export_presets.cfg', 'scripts/**/*.gd', 'scenes/**/*.tscn', 'data/**/*.json', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.webp') }}
          restore-keys: |
            ${{ runner.os }}-vbr-import-4.6.3-

      - name: Godot import
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout 420s "$GODOT" --headless --path "$GITHUB_WORKSPACE" --import

      - name: Save Godot import cache
        if: steps.import-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .godot
          key: ${{ runner.os }}-vbr-import-4.6.3-${{ hashFiles('project.godot', 'export_presets.cfg', 'scripts/**/*.gd', 'scenes/**/*.tscn', 'data/**/*.json', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.webp') }}

      - name: Compile all scripts
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          timeout 240s "$GODOT" --headless --path "$GITHUB_WORKSPACE" res://scenes/AllScriptsCompileSmoke.tscn

      - name: Normal mission boot lifecycle I–VII
        shell: bash
        timeout-minutes: 14
        run: |
          set -uo pipefail
          failures=()
          run_boot() {
            local label="$1"
            shift
            echo "========== BOOT ${label} =========="
            if "$@"; then
              echo "BOOT_MATRIX_OK ${label}"
            else
              code=$?
              echo "BOOT_MATRIX_FAILED ${label} exit=${code}" >&2
              failures+=("${label}:${code}")
            fi
          }
          for mission in 1 2 3 4 5; do
            run_boot "mission-${mission}" env VBR_SMOKE_MISSION="$mission"               timeout 60s "$GODOT" --headless --path "$GITHUB_WORKSPACE" res://scenes/MissionBootSmoke.tscn
          done
          for branch in south north; do
            run_boot "mission-6-${branch}" env VBR_SMOKE_MISSION=6 VBR_SMOKE_BRANCH="$branch"               timeout 60s "$GODOT" --headless --path "$GITHUB_WORKSPACE" res://scenes/MissionBootSmoke.tscn
            run_boot "mission-7-${branch}" env VBR_SMOKE_MISSION=7 VBR_SMOKE_BRANCH="$branch"               timeout 60s "$GODOT" --headless --path "$GITHUB_WORKSPACE" res://scenes/MissionBootSmoke.tscn
          done
          if ((${#failures[@]} > 0)); then
            printf 'BOOT_MATRIX_FAILURES %s\n' "${failures[*]}" >&2
            exit 1
          fi
          echo "BOOT_MATRIX_ALL_OK cases=9"

      - name: Runtime smoke tests
        shell: bash
        timeout-minutes: 28
        run: |
          set -uo pipefail
          scenes=(
            AtacProgressionSmoke
            BattleStartupSmoke
            Mission3Smoke
            Mission4Smoke
            Mission5Smoke
            Mission6Smoke
            Mission7Smoke
            MovementInputSmoke
            DeathCleanupSmoke
            StorySmoke
            VisibilitySmoke
            PerformanceSmoke
            ArenaSmoke
          )
          failures=()
          for scene in "${scenes[@]}"; do
            echo "========== RUN ${scene} =========="
            if timeout 90s "$GODOT" --headless --path "$GITHUB_WORKSPACE" "res://scenes/${scene}.tscn"; then
              echo "RUNTIME_MATRIX_OK ${scene}"
            else
              code=$?
              echo "RUNTIME_MATRIX_FAILED ${scene} exit=${code}" >&2
              failures+=("${scene}:${code}")
            fi
          done
          if ((${#failures[@]} > 0)); then
            printf 'RUNTIME_MATRIX_FAILURES %s\n' "${failures[*]}" >&2
            exit 1
          fi
          echo "RUNTIME_MATRIX_ALL_OK cases=${#scenes[@]}"

  windows-export:
    name: Windows export
    needs: validate-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Godot editor cache
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/godot/4.6.3
          key: ${{ runner.os }}-godot-editor-4.6.3-v2

      - name: Emergency Godot editor download
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_CACHE_DIR"
          archive="$RUNNER_TEMP/godot-4.6.3.zip"
          curl -fL --retry 6 --retry-all-errors --retry-delay 3 \
            --connect-timeout 30 --max-time 720 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip" \
            -o "$archive"
          unzip -q "$archive" -d "$GODOT_CACHE_DIR"
          chmod +x "$GODOT_CACHE_DIR/$GODOT_BINARY"

      - name: Set Godot path
        shell: bash
        run: |
          set -euo pipefail
          test -x "$GODOT_CACHE_DIR/$GODOT_BINARY"
          echo "GODOT=$GODOT_CACHE_DIR/$GODOT_BINARY" >> "$GITHUB_ENV"

      - name: Restore Godot import cache
        uses: actions/cache/restore@v4
        with:
          path: .godot
          key: ${{ runner.os }}-vbr-import-4.6.3-${{ hashFiles('project.godot', 'export_presets.cfg', 'scripts/**/*.gd', 'scenes/**/*.tscn', 'data/**/*.json', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.webp') }}
          restore-keys: |
            ${{ runner.os }}-vbr-import-4.6.3-

      - name: Restore Windows export templates cache
        id: templates-cache
        uses: actions/cache/restore@v4
        with:
          path: .ci-cache/export_templates/4.6.3.stable
          key: ${{ runner.os }}-godot-4.6.3-windows-x86_64-templates-v2

      - name: Download only the required Windows templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        shell: bash
        timeout-minutes: 70
        run: |
          set -euo pipefail
          mkdir -p "$TEMPLATE_DIR"
          archive="$RUNNER_TEMP/export_templates_4.6.3.tpz"
          urls=(
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
            "https://downloads.godotengine.org/?flavor=stable&platform=templates&slug=export_templates.tpz&version=${GODOT_VERSION}"
          )
          downloaded=false
          for url in "${urls[@]}"; do
            echo "Downloading export templates from: $url"
            if curl -fL --retry 10 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 3900 -C - "$url" -o "$archive"; then
              downloaded=true
              break
            fi
            rm -f "$archive"
          done
          test "$downloaded" = true

          extract_dir="$RUNNER_TEMP/windows-templates"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          unzip -q "$archive" \
            'templates/windows_release_x86_64.exe' \
            'templates/windows_debug_x86_64.exe' \
            -d "$extract_dir"
          cp -a "$extract_dir/templates/." "$TEMPLATE_DIR/"
          test -s "$TEMPLATE_DIR/windows_release_x86_64.exe"
          test -s "$TEMPLATE_DIR/windows_debug_x86_64.exe"
          du -sh "$TEMPLATE_DIR"

      - name: Save Windows export templates cache
        if: steps.templates-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ci-cache/export_templates/4.6.3.stable
          key: ${{ runner.os }}-godot-4.6.3-windows-x86_64-templates-v2

      - name: Install cached Windows templates for Godot
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$HOME/.local/share/godot/export_templates/4.6.3.stable"
          rm -rf "$install_dir"
          mkdir -p "$install_dir"
          cp -a "$TEMPLATE_DIR/." "$install_dir/"
          test -s "$install_dir/windows_release_x86_64.exe"

      - name: Refresh import cache for export
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout 420s "$GODOT" --headless --path "$GITHUB_WORKSPACE" --import

      - name: Windows export
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build/windows"
          timeout 840s "$GODOT" --headless --path "$GITHUB_WORKSPACE" \
            --export-release "Windows Desktop (Clean Prototype)" \
            "$GITHUB_WORKSPACE/build/windows/Vanguard Bandits Remaster.exe"
          test -s "$GITHUB_WORKSPACE/build/windows/Vanguard Bandits Remaster.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Vanguard-Bandits-Remaster-2.0.6-Windows
          path: build/windows/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
